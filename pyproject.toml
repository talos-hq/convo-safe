[build-system]
requires = ["soldr>=0.9.56"]
build-backend = "soldr"

[project]
name = "convo-safe"
version = "0.1.0"
description = "Reversible prompt redaction backed by a local encrypted Keybox"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/talos-hq/convo-safe"

[tool.maturin]
module-name = "convo_safe._native"
python-source = "python"
no-default-features = true
features = ["python", "pyo3/extension-module"]
include = [{ path = "rust-toolchain.toml", format = "sdist" }]

[tool.soldr.pep517]
bundle-bins = [{ bin = "convo-safe", package = "convo-safe" }]

[dependency-groups]
lint = ["pylint", "ruff"]

[tool.ruff.lint]
extend-select = ["I", "C901", "RUF100"]

[tool.pylint.main]
extension-pkg-allow-list = ["convo_safe._native"]

[tool.ruff.per-file-target-version]
"ci/*.py" = "py311"
